<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>JS Joust — Controller</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/controller.css">
</head>
<body>
<div id="screen" class="screen lobby">
  <div id="joinBox" class="join">
    <div id="roomRow" class="room-row">
      <input id="roomInput" class="field" placeholder="ROOM CODE" maxlength="4"><br>
    </div>
    <input id="nameInput" class="field" placeholder="Your name" maxlength="12"><br>
    <button class="btn" onclick="join()">Join Game</button>
    <div id="error" class="error"></div>
  </div>
  <div id="gameBox" class="game hidden">
    <div id="status" class="status">WAITING</div>
    <div id="sub" class="sub"></div>
  </div>
</div>

<script>
const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${wsProtocol}//${location.host}`);
const screenEl = document.getElementById('screen');
const statusEl = document.getElementById('status');
const subEl = document.getElementById('sub');
const errorEl = document.getElementById('error');
let myId = null;
let alive = true;
let gameState = 'lobby';
let freezeActive = false;

// pre-fill room code from QR link, and hide the field if present
const params = new URLSearchParams(location.search);
const prefilledRoom = params.get('room');
if (prefilledRoom) {
  document.getElementById('roomRow').classList.add('hidden');
}

function join() {
  const room = prefilledRoom || document.getElementById('roomInput').value;
  const name = document.getElementById('nameInput').value || 'Player';
  if (!room) { errorEl.textContent = 'Enter a room code'; return; }
  if (ws.readyState !== WebSocket.OPEN) {
    errorEl.textContent = 'Connecting... tap Join again';
    return;
  }
  requestMotionPermission();
  ws.send(JSON.stringify({ type: 'join', room, name }));
}

let motionListening = false;

function requestMotionPermission() {
  const startListening = () => {
    if (motionListening) return;
    motionListening = true;
    window.addEventListener('devicemotion', onMotion);
  };
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(state => {
      if (state === 'granted') startListening();
    }).catch(console.error);
  } else {
    startListening();
  }
}

let gravX = 0;
let gravY = 0;
let gravZ = 0;
const GRAVITY_ALPHA = 0.85;

function vectorMag(v) {
  return Math.sqrt((v.x || 0) ** 2 + (v.y || 0) ** 2 + (v.z || 0) ** 2);
}

function onMotion(e) {
  const user = e.acceleration;
  const raw = e.accelerationIncludingGravity;
  let magUser = 0;
  let magLinear = 0;

  if (user && user.x != null) magUser = vectorMag(user);

  if (raw && raw.x != null) {
    const ax = raw.x || 0;
    const ay = raw.y || 0;
    const az = raw.z || 0;
    gravX = GRAVITY_ALPHA * gravX + (1 - GRAVITY_ALPHA) * ax;
    gravY = GRAVITY_ALPHA * gravY + (1 - GRAVITY_ALPHA) * ay;
    gravZ = GRAVITY_ALPHA * gravZ + (1 - GRAVITY_ALPHA) * az;
    magLinear = Math.sqrt((ax - gravX) ** 2 + (ay - gravY) ** 2 + (az - gravZ) ** 2);
  }

  const magnitude = Math.max(magUser, magLinear);
  if (!magnitude || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'motion', magnitude }));
}

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);
  if (msg.type === 'join_error') {
    errorEl.textContent = msg.message;
  }
  if (msg.type === 'joined') {
    myId = msg.id;
    document.getElementById('joinBox').classList.add('hidden');
    document.getElementById('gameBox').classList.remove('hidden');
  }
  if (msg.type === 'state') {
    gameState = msg.gameState;
    const me = msg.players.find(p => p.id === myId);
    if (me) alive = me.alive;
    render();
  }
  if (msg.type === 'tempo') {
    freezeActive = msg.freezeActive;
    render();
  }
};

function render() {
  if (gameState === 'lobby') {
    statusEl.textContent = 'WAITING';
    subEl.textContent = 'Hang tight for the host to start';
    screenEl.className = 'screen lobby';
  } else if (gameState === 'countdown') {
    statusEl.textContent = 'GET READY';
    subEl.textContent = '...';
    screenEl.className = 'screen lobby';
  } else if (gameState === 'live') {
    if (!alive) {
      statusEl.textContent = 'OUT';
      subEl.textContent = 'You moved too much';
      screenEl.className = 'screen dead';
    } else if (freezeActive) {
      statusEl.textContent = 'FREEZE!';
      subEl.textContent = "Don't move a muscle";
      screenEl.className = 'screen freeze';
    } else {
      statusEl.textContent = 'STAY STEADY';
      subEl.textContent = 'Joust!';
      screenEl.className = 'screen live';
    }
  }
}
</script>
</body>
</html>
