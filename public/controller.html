<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>JS Joust — Controller</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/controller.css">
</head>
<body>
<div id="screen" class="screen lobby">
  <div id="joinBox" class="join">
    <div id="roomRow" class="room-row">
      <input id="roomInput" class="field" placeholder="ROOM CODE" maxlength="4"><br>
    </div>
    <input id="nameInput" class="field" placeholder="Your name" maxlength="12"><br>
    <button class="btn" onclick="join()">Join Game</button>
    <div id="error" class="error"></div>
  </div>
  <div id="gameBox" class="game hidden">
    <div id="status" class="status">WAITING</div>
    <div id="sub" class="sub"></div>
  </div>
</div>

<script>
const ws = new WebSocket(`ws://${location.host}`);
const screenEl = document.getElementById('screen');
const statusEl = document.getElementById('status');
const subEl = document.getElementById('sub');
const errorEl = document.getElementById('error');
let myId = null;
let alive = true;
let gameState = 'lobby';
let freezeActive = false;

// pre-fill room code from QR link, and hide the field if present
const params = new URLSearchParams(location.search);
const prefilledRoom = params.get('room');
if (prefilledRoom) {
  document.getElementById('roomRow').classList.add('hidden');
}

function join() {
  const room = prefilledRoom || document.getElementById('roomInput').value;
  const name = document.getElementById('nameInput').value || 'Player';
  if (!room) { errorEl.textContent = 'Enter a room code'; return; }
  ws.send(JSON.stringify({ type: 'join', room, name }));
}

function requestMotionPermission() {
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(state => {
      if (state === 'granted') window.addEventListener('devicemotion', onMotion);
    }).catch(console.error);
  } else {
    window.addEventListener('devicemotion', onMotion);
  }
}

function onMotion(e) {
  const a = e.acceleration || e.accelerationIncludingGravity;
  if (!a) return;
  const magnitude = Math.sqrt((a.x||0)**2 + (a.y||0)**2 + (a.z||0)**2);
  ws.send(JSON.stringify({ type: 'motion', magnitude }));
}

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);
  if (msg.type === 'join_error') {
    errorEl.textContent = msg.message;
  }
  if (msg.type === 'joined') {
    myId = msg.id;
    document.getElementById('joinBox').classList.add('hidden');
    document.getElementById('gameBox').classList.remove('hidden');
    requestMotionPermission();
  }
  if (msg.type === 'state') {
    gameState = msg.gameState;
    const me = msg.players.find(p => p.id === myId);
    if (me) alive = me.alive;
    render();
  }
  if (msg.type === 'tempo') {
    freezeActive = msg.freezeActive;
    render();
  }
};

function render() {
  if (gameState === 'lobby') {
    statusEl.textContent = 'WAITING';
    subEl.textContent = 'Hang tight for the host to start';
    screenEl.className = 'screen lobby';
  } else if (gameState === 'countdown') {
    statusEl.textContent = 'GET READY';
    subEl.textContent = '...';
    screenEl.className = 'screen lobby';
  } else if (gameState === 'live') {
    if (!alive) {
      statusEl.textContent = 'OUT';
      subEl.textContent = 'You moved too much';
      screenEl.className = 'screen dead';
    } else if (freezeActive) {
      statusEl.textContent = 'FREEZE!';
      subEl.textContent = "Don't move a muscle";
      screenEl.className = 'screen freeze';
    } else {
      statusEl.textContent = 'STAY STEADY';
      subEl.textContent = 'Joust!';
      screenEl.className = 'screen live';
    }
  }
}
</script>
</body>
</html>
